# Prometheus pulls ("scrapes") /metrics from each service on a schedule.
global:
  scrape_interval: 5s       # short for a responsive demo; 15-30s is typical in production
  evaluation_interval: 5s   # how often alert rules are checked

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: churn-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: churn-drift
    static_configs:
      - targets: ["drift:8001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

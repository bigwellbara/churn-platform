[project]
name = "churn-platform"
version = "0.1.0"
description = "End-to-end ML churn prediction platform: training, serving, monitoring and deployment."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "mlflow>=3.1",
    "skops>=0.13",
    "matplotlib>=3.8",
]

[project.scripts]
churn-train = "churn.training.train:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]
# Notebook tooling, kept out of CI: `uv sync --group eda`
eda = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=churn --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

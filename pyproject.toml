[project]
name = "churn-platform"
version = "0.1.0"
description = "End-to-end ML churn prediction platform: training, serving, monitoring and deployment."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Core: everything needed to load the model and make a prediction.
dependencies = [
    "pandas>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # On Linux (Docker, CI) the CPU-only build avoids ~250 MB of NVIDIA GPU libraries.
    # Both packages install the same `xgboost` module. Pinned to the SAME exact version:
    # the model must be served by the library version that trained it.
    "xgboost==3.2.0; sys_platform != 'linux'",
    "xgboost-cpu==3.2.0; sys_platform == 'linux'",
    "skops>=0.13",
]

[project.scripts]
churn-train = "churn.training.train:main"
churn-export = "churn.training.export:main"
churn-drift = "churn.monitoring.monitor:main"
churn-simulate = "churn.monitoring.simulate:main"
churn-gate = "churn.gate:main"
churn-smoke = "churn.smoke:main"

[dependency-groups]
# Training and experiment tracking (not installed in the API image).
train = [
    "mlflow>=3.1",
    "matplotlib>=3.8",
]
# Serving layer.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "httpx>=0.27",
]
# Load testing, kept out of CI: `uv run --group load locust ...` (see docs/LOAD_TEST.md)
load = [
    "locust==2.47.0",
]
# Notebook tooling, kept out of CI: `uv sync --group eda`
eda = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.uv]
# Plain `uv sync` installs everything for local work; Docker picks only what it needs.
default-groups = ["dev", "train", "api"]
# Supply-chain cooldown: when resolving, ignore releases less than 14 days old. Brand-new
# releases are where breaking bugs and compromised uploads tend to appear. A rolling
# window (not a fixed date) matches Dependabot's 14-day cooldown, so its update PRs can
# resolve. Installs still use the exact versions pinned in uv.lock.
exclude-newer = "14 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=churn --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

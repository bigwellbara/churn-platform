name: CI

# Runs on every pull request and on main. A green run on main is what triggers the
# deploy workflow (deploy.yml), so everything here is a precondition for production.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python and dependencies (from lockfile)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Tests with coverage
        run: uv run pytest --cov-report=xml --cov-fail-under=80

      # Unit tests check the code; the gate checks the model artefact that will ship.
      - name: Model quality gate
        run: uv run churn-gate

  dashboard:
    # The Next.js dashboard: lint, type-check, unit tests (including a check that its model
    # report matches reports/metrics.json), and a production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    # Build the exact production image and prove it serves correct predictions with its
    # default settings, inside the smallest memory limit it is deployed to (Render free:
    # 512 MB).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: churn-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          # Layer cache in GitHub's cache: unchanged dependency layers are not rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container (512 MB memory limit, default settings)
        run: docker run -d --name api -p 8000:8000 --cpus 1 --memory 512m churn-api:ci

      - name: Smoke test
        run: python3 src/churn/smoke.py http://localhost:8000 --expect-sha "${{ github.sha }}"

      - name: Image size and container logs
        if: always()
        run: |
          docker image ls churn-api:ci
          docker logs api 2>&1 | tail -n 50

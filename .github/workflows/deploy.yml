name: Deploy

# Continuous delivery, after CI passes on main. Build once, deploy that exact image:
#
#   publish    build the image, push it to GitHub Container Registry (ghcr.io) tagged with
#              the commit SHA. Free for public repos; authenticated with the job's own
#              GITHUB_TOKEN, so no extra credentials.
#   render     (if configured) tell Render to deploy that image by digest, wait until the
#              new commit is live, smoke test it, and roll back to the previous image
#              automatically if it fails.
#   cloud-run  (if a GCP project is configured) the Google Cloud Run pipeline: revision
#              with 0% traffic, smoke test on its private URL, then switch traffic.
#
# A target that is not configured is skipped, not failed. Setup: docs/DEPLOYMENT.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual redeploy of the current main

# One deploy at a time, and never cancel one half-way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/churn-api

jobs:
  publish:
    # CI must have passed on a push to main (pull-request runs never deploy).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SHA }} # exactly the commit CI tested

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          build-args: GIT_SHA=${{ env.SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Churn prediction API (FastAPI + XGBoost)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo "\`${IMAGE}:${SHA}\`"
            echo ""
            echo "digest \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: render
      url: ${{ vars.RENDER_SERVICE_URL }}
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      URL: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HOOK" ] || [ -z "$URL" ]; then
            echo "::notice::Render not configured (secret RENDER_DEPLOY_HOOK_URL, variable RENDER_SERVICE_URL); skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ env.SHA }}

      # Remember what is live now, so a failed release can be rolled back to it.
      # (A free instance may be asleep: allow time for it to wake up.)
      - name: Record the currently deployed commit
        id: prev
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          prev=$(curl -fsS --max-time 300 "$URL/" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha", ""))' || true)
          if [[ "$prev" =~ ^[0-9a-f]{40}$ ]] && [ "$prev" != "$SHA" ]; then
            echo "Currently live: $prev"
            echo "sha=$prev" >> "$GITHUB_OUTPUT"
          else
            echo "No previous release to roll back to (live: '${prev}')."
          fi

      - name: Trigger the Render deploy (by digest)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          img=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
            "${IMAGE}@${{ needs.publish.outputs.digest }}")
          code=$(curl -sS -o /tmp/hook.json -w '%{http_code}' -X POST "${HOOK}&imgURL=${img}")
          echo "Render answered HTTP $code"
          [ "$code" = 200 ] || [ "$code" = 202 ] || { cat /tmp/hook.json; exit 1; }

      # Render keeps serving the old version until the new one passes its health check,
      # so wait for GET / to report the new commit, then run every check against it.
      # A free instance has 0.1 CPU: start-up takes ~2 minutes, so allow 15.
      - name: Wait for the new version and smoke test it
        if: steps.cfg.outputs.enabled == 'true'
        run: python3 src/churn/smoke.py "$URL" --expect-sha "$SHA" --startup-timeout 900

      - name: Roll back to the previous image
        if: failure() && steps.prev.outputs.sha != ''
        run: |
          img=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
            "${IMAGE}:${{ steps.prev.outputs.sha }}")
          curl -fsS -X POST "${HOOK}&imgURL=${img}" -o /dev/null
          echo "::error::Release ${SHA:0:7} failed its smoke test; rolled back to ${{ steps.prev.outputs.sha }}."
          python3 src/churn/smoke.py "$URL" --expect-sha "${{ steps.prev.outputs.sha }}" --startup-timeout 900

  cloud-run:
    # Runs only once a GCP project is set up (infra/gcp/bootstrap.sh sets these variables).
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for Google
    environment:
      name: cloud-run
      url: ${{ steps.candidate.outputs.service_url }}
    env:
      SERVICE: churn-api
      REPOSITORY: churn
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4.4.1

      # Cloud Run pulls from Artifact Registry, so the image is pushed there too
      # (same Dockerfile and build cache, so the layers are identical).
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ env.SHA }}
          build-args: GIT_SHA=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy candidate revision (no traffic yet)
        id: candidate
        env:
          # Deploy by digest, not tag: the revision runs exactly the bytes we just pushed.
          AR_IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}@${{ steps.image.outputs.digest }}
        run: |
          TAG="sha-${SHA:0:7}"
          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            TRAFFIC=(--no-traffic)
          else
            TRAFFIC=()  # first ever deploy: a brand-new service must take the traffic
            echo "::notice::Service does not exist yet; this first deploy goes live directly."
          fi

          # 1 vCPU / 1 GiB, scale to zero, at most 2 instances (a hard cost ceiling).
          # The image default INFERENCE_PROCESSES=0 (model in-process) keeps cold starts
          # short; see docs/DEPLOYMENT.md.
          gcloud run deploy "$SERVICE" \
            --image "$AR_IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --port 8000 \
            --execution-environment gen2 \
            --cpu 1 --memory 1Gi --cpu-boost \
            --concurrency 40 --min-instances 0 --max-instances 2 --timeout 30 \
            --set-env-vars "LOG_LEVEL=INFO" \
            --labels "app=churn-platform,git-sha=${SHA:0:7}" \
            --tag "$TAG" "${TRAFFIC[@]}" \
            --quiet

          DESC=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)
          REVISION=$(jq -r --arg t "$TAG" '.status.traffic[] | select(.tag==$t) | .revisionName' <<<"$DESC")
          CANDIDATE_URL=$(jq -r --arg t "$TAG" '.status.traffic[] | select(.tag==$t) | .url' <<<"$DESC")
          SERVICE_URL=$(jq -r '.status.url' <<<"$DESC")
          echo "Candidate $REVISION at $CANDIDATE_URL"
          {
            echo "tag=$TAG"
            echo "revision=$REVISION"
            echo "candidate_url=$CANDIDATE_URL"
            echo "service_url=$SERVICE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test candidate (users still on the previous revision)
        run: python3 src/churn/smoke.py "${{ steps.candidate.outputs.candidate_url }}" --expect-sha "$SHA"

      - name: Promote candidate to 100% of traffic
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.candidate.outputs.revision }}=100" --quiet

      - name: Smoke test production URL
        run: python3 src/churn/smoke.py "${{ steps.candidate.outputs.service_url }}" --expect-sha "$SHA"

      - name: Remove the candidate tag
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --remove-tags "${{ steps.candidate.outputs.tag }}" --quiet
